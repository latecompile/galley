name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Galley is an Arch application with four pkg-config dependencies, one of
    # which is qt6-webengine. Building on Arch is both what the PKGBUILD does
    # and the only way to get those versions without building Qt from source.
    container: archlinux:base-devel

    steps:
      # Before checkout: without git installed, actions/checkout falls back to
      # downloading a tarball, and then there are no tags for `git describe` to
      # stamp the version from.
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git make gcc pkgconf \
            qt6-base qt6-webengine qt6-webchannel md4c tomlplusplus

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checkout
        # The container runs as root over a working directory owned by the
        # runner user, which git refuses to read from until told otherwise.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: make

      - name: Report the version
        # Cheap, and it catches the describe-to-version path breaking, which
        # nothing else here would notice.
        run: ./galley --version

      - name: Test
        # run.sh forces the offscreen platform itself, so this needs no display
        # and no xvfb.
        run: make check
